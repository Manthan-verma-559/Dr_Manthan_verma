name: Deploy MkDocs

on:
  push:
    branches:
      - main # Change this to master if that is your primary branch name

permissions:
  contents: write # Crucial: Allows the Action to push the built site to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        # If you use plugins, change this to: pip install -r requirements.txt
        run: pip install mkdocs-material 

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
